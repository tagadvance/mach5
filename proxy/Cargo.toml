[package]
name = "mach5-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
quiche = { version = "0.29.3", features = ["boringssl-boring-crate"] }
boring = "4.3"
rcgen = { version = "0.14", features = ["x509-parser"] }
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
ureq = "2"
time = "0.3"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "mach5-proxy"
path = "src/main.rs"
