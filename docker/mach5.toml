# mach5 configuration — FOR THE CONTAINER. This is the one compose mounts.
#
# ============================================================================
#  The repo-root mach5.toml is for running locally and will not work here: it
#  listens on 4433/4443, has no [ca], and leaves [paths] at defaults that a
#  container cannot write. Mounting it by mistake gives you an ephemeral CA,
#  permission-denied warnings for ~/.cache, and a bind failure — none of which
#  names the actual cause.
# ============================================================================
#
# Paths are relative to /etc/mach5, which is the image's working directory and
# where compose mounts the plugins and CA.
#
# The difference from the repo-root mach5.toml is the ports: here everything is
# on 443, because that is what clients actually connect to.

listen = "0.0.0.0:443"
listen_tcp = "0.0.0.0:443"

[ca]
# Mounted read-only by compose. Run security/init.sh once to produce these; it
# writes a PEM certificate and a PEM private key, which is what these two want.
# Never commit them — *.pem and *.crt are gitignored for that reason.
cert = "security/mach5_root_cert.pem"
key = "security/mach5_root_key.pem"

[http]
# Advertise HTTP/3 on the port clients reach us on.
alt_svc = 'h3=":443"; ma=86400'
keep_alive = true
idle_timeout_seconds = 60
# Compress a buffered body an origin sent in the clear, when the client accepts
# a coding we can produce. Text only, and only above a kilobyte — a JPEG would
# just get bigger.
compress = true

[paths]
# A named volume, so re-encoded assets survive a container restart.
cache_dir = "/var/cache/mach5"
# Where data someone actually typed is kept — hidden-element selectors, so far.
# Deliberately not the cache: a cache may be wiped at any moment, and losing a
# list built up by hand is a different kind of loss to re-encoding an image.
# This needs a writable volume of its own, or every restart forgets it.
state_dir = "/var/lib/mach5"

[plugins]
dir = "plugins"
enabled = true
stamp_responses = false

[blocklist]
# First-stage ad blocking: a request to a listed domain is answered here and
# never reaches the origin — or a plugin. A parent domain covers everything
# beneath it, so `doubleclick.net` also blocks `ad.g.doubleclick.net`.
#
# Lists may be hosts files (StevenBlack's hosts file works as-is) or
# Adblock-style domain lists (EasyList's `||ads.example.com^` anchors and `@@||`
# exceptions). Anything beyond a domain match is skipped.
#
# The lists in `files` are read from inside the container, so mount them in —
# compose does this the same way it mounts the plugins and the CA. The ones in
# `urls` need no mount at all, which makes them the easier half in a container.
enabled = true
# files = ["/etc/mach5/lists/hosts"]

# Lists to fetch rather than read. The obvious one is StevenBlack's unified
# hosts file, which is rebuilt continuously and needs nothing else:
# urls = ["https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"]
#
# Each fetched list is cached under cache_dir as blocklists/<hash-of-url>.txt,
# so the cache_dir volume above is what makes a restart come up blocking
# immediately instead of waiting on the network — without it every restart
# starts with nothing and refetches the lot. The origin certificate is
# validated, as it is for everything else mach5 fetches. An etag or
# last-modified is remembered beside the cache and sent back, so an unchanged
# list costs a 304 rather than a download — and a fetch that fails falls back to
# the cached copy and warns, never to an empty list.

# How often the files are re-read and the URLs re-fetched, on one background
# thread; the container never waits on it, at startup or afterwards. Staleness
# in a blocker is silent — things quietly stop being blocked and nothing says
# so — which is why this is on by default. 0 switches refreshing off.
refresh_hours = 24
# Never blocked, whatever the lists say. Covers subdomains too.
# allow = ["example.com"]

[cosmetic]
# Second-stage blocking: the rules the blocklist skips. A blocked domain never
# answers at all, which does nothing about a cookie banner served by the site
# you actually wanted — that is what a cosmetic rule is for.
#
# `example.com##.cookie-banner` hides `.cookie-banner` on example.com and its
# subdomains; domains may be comma-separated; a `~sub.example.com` prefix carves
# one back out; `example.com#@#.selector` is an exception that beats a hide.
# `##.selector` with no domain is a generic rule — see `generic` below. Network
# rules, scriptlets and procedural pseudo-classes are skipped: this is not a
# filter engine. What survives is merged into `/.mach5/hidden.css`.
#
# Be honest about what this is: hiding a consent dialog is not answering it. The
# site still believes it is waiting, and some will not scroll, play or log in
# until one is dealt with properly. When a site stops working, switch this off
# first.
#
# The lists in `files` are read from inside the container, so mount them in, as
# with the blocklist's. The ones in `urls` need no mount at all.
enabled = true
# files = ["/etc/mach5/lists/easylist.txt"]

# Lists to fetch rather than read. EasyList is the general one; uBlock Origin's
# annoyances lists are the ones that matter here, since the cookie notices are
# most of the point:
# urls = [
#   "https://easylist.to/easylist/easylist.txt",
#   "https://ublockorigin.github.io/uAssets/filters/annoyances-cookies.txt",
#   "https://ublockorigin.github.io/uAssets/filters/annoyances-others.txt",
# ]
#
# Each is cached under cache_dir as cosmetic/<hash-of-url>.txt, so the cache_dir
# volume above is again what makes a restart come up hiding things immediately
# instead of refetching the lot. Revalidated with an etag or last-modified, and
# fetched with the origin certificate validated, exactly as the blocklist is.

# How often the files are re-read and the URLs re-fetched. 0 switches refreshing
# off. A cosmetic list goes stale faster than a hosts file: sites move their
# banners, and a rule that no longer matches anything fails silently.
refresh_hours = 24

# Whether to apply the rules that name no domain — `##.ad-slot` and the like.
#
# Off, and worth leaving off. A generic rule fires on every site in the world, so
# a bad one breaks a page that has nothing to do with the list it came from, and
# nothing on the broken page connects it back to a file you never read.
generic = false

[internal]
# The proxy's own endpoints, under `/.mach5/` on every origin at once. Because
# the deployment answers every DNS query with the proxy's address, a relative
# URL on any page reaches us — which is somewhere to host endpoints of our own
# without owning a domain, and without a page making a cross-origin request.
#
# So far that means the per-site list of elements to hide: a cosmetic filter
# that lives here rather than in the blocklist, which deliberately stops at
# domain matching. What is stored is keyed by the host the client asked for, so
# one site can never read or write another's list. Kept in
# `<state_dir>/hidden.json`, so state_dir above must be writable.
enabled = true

[inject]
# Puts two same-origin tags into every HTML page just before `</head>` — or
# just after `<body>` when there is no head:
#
#   <link rel="stylesheet" href="/.mach5/hidden.css">
#   <script src="/.mach5/mach5.js" defer>
#
# The stylesheet applies this host's hidden-element list before first paint; the
# script is the picker that adds to it — Ctrl+Shift+H starts picking, a click
# hides the element under the pointer, `u` forgets the whole site's list, and
# Escape stops. Only the one global shortcut, because every other combination is
# already somebody's: Ctrl+Shift+U never reaches a page on a Linux desktop.
#
# Both are `src`/`href` URLs rather than inline tags on purpose: a site whose
# CSP is `script-src 'self'` still runs them, where inline script would be
# blocked. A nonce-only or hash-only CSP still blocks them, and mach5 will not
# rewrite a site's `content-security-policy` to get around that.
#
# Only 200 responses whose content-type is text/html are touched; everything
# else streams through untouched.
enabled = true
# Hosts left exactly as the origin sent them. A parent domain covers its
# subdomains, as in the blocklist. This is where a bank goes: anywhere you would
# rather mach5 did not modify the page at all.
# exclude = ["bank.example"]

# Mark off-screen images `loading="lazy"`, so a browser fetches them when they
# are needed rather than all at once. On a high-latency link the win is round
# trips rather than bytes, which is the thing that hurts there.
#
# A site that already does this well sees no change — the Guardian gained four
# out of a hundred and eighteen, Wikipedia none. The value is for the sites that
# never got round to it, which is most of them.
lazy_images = true

# How many images to leave alone at the top of a page.
#
# Lazy-loading the image someone actually came to see makes the page slower, not
# faster: it is the documented way to ruin Largest Contentful Paint. The first
# images in a document are the ones most likely to be it, so they are left
# eager. An `<img>` whose author wrote `loading` or `fetchpriority` is never
# touched at all — they have already thought about this.
eager_images = 3

[upstream]
# Which of an origin's addresses mach5 tries first: "system", "prefer-ipv4" or
# "prefer-ipv6". Nothing is dropped, only reordered, so an AAAA-only origin is
# still reached either way.
#
# mach5 resolves on its own host, so a client with IPv6 switched off still
# reaches IPv6-only origins through it. `prefer-ipv4` is for when this host's
# IPv6 is a 6rd tunnel and slower than the IPv4 underneath it.
addresses = "system"

[images]
# Re-encode images to WebP on the way past.
#
# The one thing here that earns the word "accelerator". Text compression wins a
# few percent; images are half the weight of a page. Measured across twenty real
# ones from Wikipedia and the BBC, WebP at quality 80 took 674KB down to 352KB
# and none of them came out larger — a 232KB PNG became 24KB. Screenshots and
# unoptimised photographs are where it pays most; a site whose thumbnails a CDN
# has already squeezed will see a few percent instead.
#
# Three rules keep it from ever making a page worse: only when the client's
# `accept` says it can display WebP, only formats worth converting (never an
# existing WebP or AVIF, never an SVG), and only if the result is actually
# smaller. The response gains `vary: accept`, because what was served now
# depends on what the client asked for.
#
# The cost is CPU — roughly twelve milliseconds an image, on a worker thread —
# and it is currently paid on every request. Caching re-encoded images in
# cache_dir is on the roadmap and is what makes that a one-time cost.
enabled = true
# WebP quality, 0-100. 80 is the usual "indistinguishable at a glance" setting
# and is what the measurements above were taken at.
quality = 80
# The most pixels an image may have before it is passed through rather than
# converted. The bound has to be on pixels and not on bytes: a decoded frame
# costs width x height x 4 whatever the file compressed to, so two megabytes of
# flat-colour PNG is nearly half a gigabyte of memory and several seconds of a
# worker — and there are two worker pools of them. 16 is a 4000x4000 image,
# past anything anyone puts on a page.
max_megapixels = 16

# How much disk the re-encoded images may take, so the conversion is done once
# rather than per request. A 1600x1200 photograph costs about 2.5 seconds to
# decode and re-encode; cached, the second request for it costs five
# milliseconds.
#
# Entries are addressed by content — the SHA-256 of the original bytes and the
# quality — so there is nothing to invalidate and nothing to go stale, and an
# entry can only be reached by already holding the bytes it was made from.
#
# This saves CPU and not bandwidth: the original is still fetched from the
# origin every time. A cache that avoids the fetch as well is a different and
# more delicate thing — see the roadmap.
#
# 0 switches it off.
cache_mb = 512

# How much disk the origins' own image bytes may take, so a repeat does not have
# to be downloaded again. This is the one that saves bandwidth rather than CPU —
# it matters little on a gigabit line at home and a great deal on a cloud
# container's billed egress.
#
# It is ordinary shared-cache behaviour, not "keep it and stop asking". An entry
# still fresh by the origin's own max-age is served with no request at all; a
# stale one is revalidated with if-none-match, and a 304 is a couple of hundred
# bytes where the image was three hundred thousand. Nothing is ever served
# staler than the origin allowed.
#
# Stylesheets, scripts, fonts and images — the static furniture of a page.
# HTML is deliberately absent and stays absent until mach5 knows who is asking,
# because a page is where per-user content lives.
#
# Only what is plainly public is stored at all: a 200, no set-cookie, no
# `private`/`no-store`/`no-cache`, no authorization on the request, and no
# `vary` beyond accept and accept-encoding. Anything else is not cached rather
# than cached carefully.
#
# How much proof of publicness is wanted depends on what being wrong would cost,
# because plenty of small sites set no cache headers at all — which is much of
# why mach5 exists — and demanding a freshness lifetime everywhere would cache
# nothing for exactly those origins.
#
#   images, fonts   an etag or last-modified is enough. Never personalised, and
#                   a mistake is the wrong picture or the wrong typeface.
#   stylesheets     the same. Per-user CSS exists but is rare, and being wrong
#                   about it is cosmetic rather than a leaked credential.
#   scripts         either the origin declares a freshness lifetime, or the
#                   filename carries a content hash — `app.a1b2c3d4.js`. A
#                   fingerprint is a claim about everybody, since the whole
#                   point is that the name changes when the bytes do, and nobody
#                   fingerprints a file built per user. A plainly-named
#                   `config.js` with only an etag is not cached, because that is
#                   exactly what a script full of tokens looks like.
#
# A browser's hard refresh works: shift-reload sends `cache-control: no-cache`,
# which mach5 honours by revalidating before serving. The status page also has
# a button to empty both caches outright.
#
# 0 switches it off.
origin_cache_mb = 256
# Nothing else buffers a stylesheet — injection claims HTML and the re-encoder
# claims images — so caching one means choosing to hold it whole. This is the
# largest response worth that memory; anything bigger, or of unknown length,
# streams past uncached.
max_cacheable_mb = 8

[link]
# How fast the client is, and what that is allowed to mean.
#
# mach5 sits between two links and only one of them is worth reacting to. A CDN
# having a bad minute is not a reason to serve you grey boxes; your phone having
# one bar is. So both measurements here are ones only a client can cause: over
# QUIC it is the congestion controller's own delivery rate, derived from what
# the client acknowledged, and over TCP it is time mach5 spent parked waiting
# for the client to drain a response it had already fetched. Neither can be
# produced by a slow origin.
#
# What comes out is a tier — full quality, reduced quality, greyscale, a
# dimension-preserving placeholder, nothing — shown on `/.mach5/` for whichever
# client is reading it, which is how you check this from a phone on a real
# network. Nothing consumes the tier yet: it is measured and reported, and what
# it does to an image is a separate decision that has not been made here.
#
# Off means every client is assumed fast and nothing is stored.
enabled = true

# The ladder, in kilobits per second. A client is served the best tier whose
# floor its measured speed still clears; below the last floor it is served
# nothing. Roughly: better than DSL, DSL, 3G, 2G, and worse.
#
# They are clamped into descending order at startup, so naming them out of order
# gives you an odd ladder rather than a proxy that will not start.
#
# A tier is sticky, and moving back up needs more evidence than moving down: a
# page half in colour and half in grey looks broken, so a link that has only
# just crossed a floor is not yet treated as being on the other side of it.
full_kbps = 2000
reduced_kbps = 700
grey_kbps = 250
placeholder_kbps = 80

# How long a measurement stands for. Long enough that a phone is not
# re-measured on every page; short enough that an address which has moved to
# another network is not judged by the old one. A client with no measurement is
# assumed fast — the first thing a connection carries is a document rather than
# an image, and carrying it is itself a measurement, so the guess is wrong for
# about one document.
ttl_minutes = 10

# The most clients to remember at once. Keyed by peer address, so on a proxy
# that runs for months this is the difference between a cache and a leak. The
# key is the address and nothing else: it is wrong for a NAT'd household and
# wrong for a phone that moves, and it is wrong cheaply — the cost of confusing
# two clients is that one gets pictures chosen for the other.
max_clients = 1024

[passthrough]
# Hosts mach5 must never decrypt.
#
# Everywhere else mach5 terminates TLS, which means it holds the plaintext of
# everything it carries. For most of the web that is the point. For a bank it is
# the wrong guarantee, and `[inject] exclude` does not give the right one — that
# only stops mach5 *changing* a page it has already read.
#
# A listed host is answered by nobody here. mach5 reads the name out of the
# ClientHello without replying to it, opens a socket to the real origin, and
# copies bytes between the two. It never has the keys, never sees a byte of
# plaintext, and your browser checks the origin's own certificate — which is
# also the only arrangement a certificate-pinning app will accept.
#
# A parent covers its subdomains, as in the blocklist: `example-bank.com` covers
# `secure.example-bank.com`, which is what anyone writing that line meant.
#
# Two things worth knowing. A passed-through host gets none of mach5 — no
# blocking, no cosmetic filtering, no picker, no compression — because none of
# that is possible without reading the page; that is the trade. And a client
# that already knows about HTTP/3 for such a host has its h3 handshake refused
# on purpose, so it falls back to TCP where passthrough works.
# hosts = ["example-bank.com", "myhealthprovider.example"]

# Where a passed-through connection is carried to. 443 unless mach5 is
# listening somewhere unusual; a transparent deployment cannot recover a
# nonstandard port without SO_ORIGINAL_DST.
# Stop decrypting a host after its origin answers with a bot challenge.
#
# mach5 is what causes those. The origin sees mach5's TLS handshake and
# HTTP/1.1 rather than the browser's, while the headers still say Chrome — a
# textbook automation signature — so a managed challenge fires, and then loops,
# because whatever passed the check is not what retries it.
#
# Noticing and stepping aside is the only honest answer; the alternative is
# pretending to be a browser, which is an arms race.
#
# Learned hosts are kept apart from `hosts` above: they expire after a week,
# they are exact rather than covering subdomains, and they can be added or
# removed from the /.mach5/ page OF THAT HOST — which is reachable even when
# the site itself will not load, because mach5 serves it. Nothing a web page
# can reach touches `hosts`.
learn_from_challenges = true

port = 443

[log]
# How much of a URL is written to the log.
#
# mach5 terminates TLS for every device pointed at it, so its log is a record of
# everything those devices did — and the query string is where the dangerous
# part of that lives: OAuth codes, password-reset tokens, session ids, presigned
# signatures, search terms. Written at the default level into a container log
# that is kept until the container is removed, those are credentials sitting on
# disk long after they should have been forgotten.
#
#   "path"  scheme, host and path, without the query. The default.
#   "host"  scheme and host only, for when even a path is too much — a magic
#           link carries its secret there.
#   "full"  everything. For debugging, not for a proxy carrying real traffic.
#
# This covers URLs mach5 logs itself, including the ones quoted back inside a
# library's error message. It cannot cover what a plugin prints: plugin stderr
# goes straight to this log, so a plugin that logs bodies or URLs is its own
# decision to make.
urls = "path"

[tls]
leaf_ttl_hours = 24
clock_skew_minutes = 60
refresh_margin_minutes = 60

# Typing the phrase on the certificate warning page lets you through to that one
# host for bypass_ttl_minutes, the way Chrome's `thisisunsafe` does. Meant for
# staging origins with self-signed or expired certificates.
#
# Worth a thought before leaving this on for a deployment carrying everybody's
# traffic rather than your own: it is the only thing here that switches off a
# check no client can still do for itself. Bypasses are per-host, they expire,
# they never touch disk, and each request that uses one is a warning in the log.
allow_bypass = true
bypass_ttl_minutes = 60
# bypass_phrase = "thisisunsafe"

[limits]
max_request_body_mb = 10
# Cap on a buffered *response* body, applied both to what is read off the wire
# and to what it inflates to. A compressed body's size says nothing about the
# plain one's — gzip will do a thousand to one on the right input — so without
# this a couple of megabytes from an origin becomes a couple of gigabytes of
# resident memory here. A response over the cap is relayed to the client
# uninspected rather than refused: what it loses is being looked at.
max_response_body_mb = 64
worker_threads = "1C"
connect_timeout_seconds = 10
read_timeout_seconds = 30
plugin_timeout_seconds = 10
# Backpressure for streamed responses: how much of one may sit in memory waiting
# for a slow client before the upstream read pauses. Per response, on both front
# ends. Generous on purpose — see "Streams held back" on the status page, which
# says how often it has actually been reached.
stream_buffer_mb = 32

[quic]
max_datagram_size = 1350
max_idle_timeout_ms = 30000
initial_max_data = 10000000
initial_max_stream_data = 1000000
initial_max_streams = 100
