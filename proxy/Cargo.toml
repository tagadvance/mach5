[package]
name = "mach5-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Already in the tree behind rustls; taken directly for its HMAC, which is
# what signs the QUIC address-validation token.
ring = "0.17"
quiche = { version = "0.29.3", features = ["boringssl-boring-crate"] }
boring = "4.3"
rcgen = { version = "0.14", features = ["x509-parser"] }
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
httparse = "1"
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
tokio-boring = "4"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
tokio-stream = "0.1"
bytes = "1"
flate2 = "1"
brotli = "8"
lol_html = "3.0.1"
encoding_rs = "0.8.35"
webp = { version = "0.3.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mach5-proxy"
path = "src/main.rs"
