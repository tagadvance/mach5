services:
  mach5:
    build:
      context: .
      dockerfile: Dockerfile
    image: mach5-proxy:latest
    container_name: mach5
    restart: unless-stopped

    # Browsers open TCP 443 first and only move to QUIC once they have seen the
    # Alt-Svc header, so both are required. UDP is not optional either — without
    # it the Alt-Svc advertisement points at a closed door.
    # MACH5_BIND picks which address to listen on. Unset means all of them,
    # which is right on a box that does nothing else.
    #
    # It matters the moment something else already wants 443 — an nginx or
    # Caddy reverse proxy, almost always. Two servers cannot share a port on an
    # address, so either give mach5 a host of its own, or give it an address of
    # its own here and leave the reverse proxy on the other one.
    #
    # Note this is not the same trade as with a normal reverse proxy. mach5
    # wants to be *the* thing on 443 for every hostname there is, so sharing a
    # box with something that also wants 443 for a few specific hostnames is
    # awkward even when the ports do not collide. A separate host is the
    # simpler answer if you have one.
    ports:
      - "${MACH5_BIND:-0.0.0.0}:443:443/tcp"
      - "${MACH5_BIND:-0.0.0.0}:443:443/udp"

    # Run as whoever owns the CA private key on the host — it is mode 600, and
    # rightly so. Override with MACH5_UID/MACH5_GID if yours are not 1000.
    user: "${MACH5_UID:-1000}:${MACH5_GID:-1000}"

    # The process runs as an unprivileged user, so it needs this one capability
    # to bind 443 rather than running as root.
    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - ./docker/mach5.toml:/etc/mach5/mach5.toml:ro
      - ./plugins:/etc/mach5/plugins:ro
      # The root CA. Read-only, and never baked into the image.
      - ./security:/etc/mach5/security:ro
      - mach5-cache:/var/cache/mach5
      # Hidden-element selectors and anything else someone builds up by hand.
      # Not the cache volume: this is the one you would miss.
      - mach5-state:/var/lib/mach5

    environment:
      # info is a reasonable default; RUST_LOG=debug for handshake detail.
      RUST_LOG: ${RUST_LOG:-info}

    # IMPORTANT: the proxy must not resolve through the wildcard DNS server
    # below, or it will resolve every origin back to itself and loop. Point it
    # at pi-hole, or any resolver that gives real answers.
    dns:
      - ${MACH5_UPSTREAM_DNS:-1.1.1.1}

  # The wildcard resolver that puts traffic in front of the proxy in the first
  # place: it answers every query with mach5's address, and mach5 reads the SNI
  # to learn which origin was actually wanted.
  #
  # Optional. Skip it entirely if you already have something answering that way
  # — `docker compose up mach5` starts the proxy alone, and this service only
  # runs with `--profile dns`.
  #
  # IT NEEDS AN ADDRESS OF ITS OWN — but you very likely already have one.
  #
  # Port 53 is not shareable, so this and pi-hole cannot both listen on the same
  # address. Three situations:
  #
  #   pi-hole is on another machine
  #       Nothing to do. Leave MACH5_DNS_BIND unset and this listens on every
  #       address, like any other container.
  #
  #   pi-hole is on THIS machine, and clients arrive over WireGuard
  #       Set MACH5_DNS_BIND to your WireGuard interface's address — 10.x.y.1,
  #       whatever `ip addr show wg0` says. That address already exists, it is
  #       exactly where your clients are coming from, and pi-hole is on the LAN
  #       address, so the two never collide. This is almost certainly you.
  #
  #   pi-hole is on THIS machine and clients are on the LAN
  #       Set MACH5_DNS_BIND to a second LAN address. That one you do have to
  #       create (`ip addr add`, persisted by your network config). A macvlan
  #       network is the other way — Docker gives the container its own LAN
  #       address and you alias nothing — but a macvlan container is
  #       unreachable from its own host, including anything the host forwards,
  #       so it is wrong the moment WireGuard or a VPN terminates here.
  dns:
    image: dockurr/dnsmasq:latest
    container_name: mach5-dns
    restart: unless-stopped
    profiles: ["dns"]

    # One address, not all of them. This is the whole trick for coexisting with
    # pi-hole: two resolvers, two addresses, one host, no aliasing.
    ports:
      - "${MACH5_DNS_BIND:-0.0.0.0}:53:53/udp"
      - "${MACH5_DNS_BIND:-0.0.0.0}:53:53/tcp"

    environment:
      # Passed through rather than interpolated into the command, so the check
      # below happens when this service starts rather than whenever anything in
      # this file is read. `docker compose up mach5` must not need it set.
      MACH5_PROXY_IP: ${MACH5_PROXY_IP:-}

    entrypoint: ["/bin/sh", "-c"]
    # The config is a template with one substitution, so the proxy address lives
    # in .env beside everything else rather than being edited into a file.
    command:
      - |
        [ -n "$$MACH5_PROXY_IP" ] || {
          echo "mach5-dns: set MACH5_PROXY_IP in .env — it is the address every" >&2
          echo "           name will resolve to, which is where mach5 is listening." >&2
          exit 1
        }
        sed "s|\$${MACH5_PROXY_IP}|$$MACH5_PROXY_IP|" /etc/dnsmasq.template > /tmp/dnsmasq.conf
        exec dnsmasq -k --conf-file=/tmp/dnsmasq.conf

    volumes:
      - ./docker/dnsmasq/dnsmasq.conf:/etc/dnsmasq.template:ro

    # Answering DNS is all it does, and it needs no more than this.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  mach5-cache:
  mach5-state:
