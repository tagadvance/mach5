# mach5 configuration.
#
# Every value here is optional — anything omitted falls back to the default
# shown in the comment. Lookup order:
#   $MACH5_CONFIG, then ./mach5.toml, then ~/.config/mach5/mach5.toml

# Address to listen on for QUIC (UDP).
listen = "0.0.0.0:4433"

# Address to listen on for TLS over TCP, serving HTTP/1.1.
#
# This is not optional in practice: HTTP/3 cannot bootstrap itself. A browser
# opens TCP 443 first and only discovers h3 from the Alt-Svc header on a
# response it got over TCP. In a real deployment both of these are port 443.
listen_tcp = "0.0.0.0:4443"

[http]
# Advertises HTTP/3 on every response served over TCP — this is what moves a
# client onto QUIC. Set to "" to keep clients on TCP. In a real deployment the
# port here is 443.
alt_svc = 'h3=":4433"; ma=86400'
keep_alive = true
idle_timeout_seconds = 60
# Compress a buffered body an origin sent in the clear, when the client accepts
# a coding we can produce. Text only, and only above a kilobyte — a JPEG would
# just get bigger. Streamed bodies are relayed with whatever coding they arrived
# in, whether this is on or off.
compress = true

[ca]
# Root CA used to sign leaves minted per SNI host. Leave both unset to generate
# an ephemeral in-memory CA (development only — no browser will trust it).
# Run security/init.sh once to write both; never commit them (*.pem, *.crt and
# *.p12 are gitignored). The cert is PEM and the key is PEM — pointing either at
# the wrong file is the one mistake mach5 will now tell you about by name.
# cert = "security/mach5_root_cert.pem"
# key = "security/mach5_root_key.pem"

[paths]
# Scratch space for cached artifacts (re-encoded assets and the like).
# cache_dir = "~/.cache/mach5"
# Where data someone actually typed is kept — hidden-element selectors, so far.
# Deliberately not the cache: a cache may be wiped at any moment, and losing a
# list built up by hand is a different kind of loss to re-encoding an image.
# state_dir = "~/.local/share/mach5"

[plugins]
# Directory of executable interceptor plugins, run in filename order. Each is a
# long-running process speaking newline-delimited JSON on stdin/stdout, so it
# can be written in any language. See plugins/README for the protocol.
dir = "plugins"
enabled = true
# Adds an `x-mach5` header to every response — a debugging aid that makes
# interception visible without writing a plugin.
stamp_responses = false

[blocklist]
# First-stage ad blocking: a request to a listed domain is answered here and
# never reaches the origin — or a plugin. Built in rather than a plugin because
# matching a hundred thousand domains on every request should not cross a JSON
# pipe into another process.
#
# A parent domain covers everything beneath it, so `doubleclick.net` also blocks
# `ad.g.doubleclick.net`.
#
# Lists may be hosts files (StevenBlack's hosts file works as-is) or
# Adblock-style domain lists — EasyList's `||ads.example.com^` anchors and its
# `@@||` exceptions are both understood. Anything beyond a domain match —
# cosmetic rules, URL patterns, regexes — is skipped; this is not a filter
# engine. Nothing is bundled: point `files` at lists on disk, `urls` at lists to
# fetch, or both.
enabled = true
# files = ["~/.config/mach5/hosts", "~/.config/mach5/easylist.txt"]

# Lists to fetch rather than read. The obvious one is StevenBlack's unified
# hosts file, which is rebuilt continuously and needs nothing else:
# urls = ["https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"]
#
# Each fetched list is cached under cache_dir as blocklists/<hash-of-url>.txt,
# so a restart with no network still comes up with yesterday's copy. The origin
# certificate is validated, as it is for everything else mach5 fetches: a file
# that decides what gets blocked is not one to take from whoever is on the wire.
# An etag or last-modified is remembered beside the cache and sent back, so an
# unchanged list costs a 304 rather than a download — and a fetch that fails
# falls back to the cached copy and warns, never to an empty list.

# How often the files are re-read and the URLs re-fetched, on one background
# thread; the proxy never waits on it, at startup or afterwards. A hosts file
# downloaded once is stale a month later, and staleness here is silent — things
# quietly stop being blocked and nothing says so — which is why this is on by
# default. 0 switches refreshing off: lists are then whatever they were when the
# proxy last started.
refresh_hours = 24
# Never blocked, whatever the lists say. Covers subdomains too.
# allow = ["example.com"]

[cosmetic]
# Second-stage blocking: the rules the blocklist skips. A blocked domain never
# answers at all, which does nothing about a cookie banner served by the site
# you actually wanted — that is what a cosmetic rule is for, and it is the same
# thing the picker does by hand, written down by somebody else.
#
# `example.com##.cookie-banner` hides `.cookie-banner` on example.com and every
# subdomain of it; several domains may share one selector, comma-separated; a
# `~sub.example.com` prefix carves a subdomain back out; and
# `example.com#@#.selector` is an exception that beats any rule trying to hide
# it. `##.selector` with no domain at all is a generic rule — see `generic`
# below. Everything else in a list is skipped: network rules, `#$#`/`#%#`/`#?#`
# scriptlets, and any selector using a procedural pseudo-class (`:has-text()`,
# `:-abp-*`, `:upward()`, `:style()`) that a browser cannot carry out on its
# own. This is not a filter engine, and a rule it cannot honour is dropped
# rather than half-honoured.
#
# What survives is merged into `/.mach5/hidden.css` for the host being read,
# after whatever the picker stored there.
#
# Worth being honest about what this is: hiding a consent dialog is not
# answering it. A hidden banner has consented to nothing on your behalf, the
# site still believes it is waiting for an answer, and some sites will not
# scroll, play or log in until one is actually given. When a site stops working,
# this is the first thing to switch off.
enabled = true
# files = ["~/.config/mach5/easylist.txt"]

# Lists to fetch rather than read. EasyList is the general one; uBlock Origin's
# annoyances lists are the ones that matter here, since the cookie notices are
# most of the point:
# urls = [
#   "https://easylist.to/easylist/easylist.txt",
#   "https://ublockorigin.github.io/uAssets/filters/annoyances-cookies.txt",
#   "https://ublockorigin.github.io/uAssets/filters/annoyances-others.txt",
# ]
#
# Each is cached under cache_dir as cosmetic/<hash-of-url>.txt, revalidated with
# an etag or last-modified, and fetched with the origin certificate validated —
# all exactly as the blocklist's URLs are, and for the same reasons.

# How often the files are re-read and the URLs re-fetched. 0 switches refreshing
# off. A cosmetic list goes stale faster than a hosts file does: sites move their
# banners, and a rule that no longer matches anything fails silently.
refresh_hours = 24

# Whether to apply the rules that name no domain — `##.ad-slot` and the like.
#
# Off, and worth leaving off. A generic rule fires on every site in the world, so
# a bad one breaks a page that has nothing to do with the list it came from, and
# there is nothing on the broken page to connect it back to a file you never
# read. The domain-specific rules are the ones carrying the weight anyway.
generic = false

[internal]
# The proxy's own endpoints, under `/.mach5/` on every origin at once. Because
# the deployment answers every DNS query with the proxy's address, a relative
# URL on any page reaches us — which is somewhere to host endpoints of our own
# without owning a domain, and without a page making a cross-origin request.
#
# So far that means the per-site list of elements to hide: a cosmetic filter
# that lives here rather than in the blocklist, which deliberately stops at
# domain matching. What is stored is keyed by the host the client asked for, so
# one site can never read or write another's list. Kept in
# `<state_dir>/hidden.json`.
enabled = true

[inject]
# Puts two same-origin tags into every HTML page just before `</head>` — or
# just after `<body>` when there is no head:
#
#   <link rel="stylesheet" href="/.mach5/hidden.css">
#   <script src="/.mach5/mach5.js" defer>
#
# The stylesheet applies this host's hidden-element list before first paint; the
# script is the picker that adds to it — Ctrl+Shift+H starts picking, a click
# hides the element under the pointer, `u` forgets the whole site's list, and
# Escape stops. Only the one global shortcut, because every other combination is
# already somebody's: Ctrl+Shift+U never reaches a page on a Linux desktop.
#
# Both are `src`/`href` URLs rather than inline tags on purpose: a site whose
# CSP is `script-src 'self'` still runs them, where inline script would be
# blocked. A nonce-only or hash-only CSP still blocks them, and mach5 will not
# rewrite a site's `content-security-policy` to get around that.
#
# Only 200 responses whose content-type is text/html are touched; everything
# else streams through untouched.
enabled = true
# Hosts left exactly as the origin sent them. A parent domain covers its
# subdomains, as in the blocklist. This is where a bank goes: anywhere you would
# rather mach5 did not modify the page at all.
# exclude = ["bank.example"]

[upstream]
# Which of an origin's addresses mach5 tries first.
#
# mach5 resolves origins on its own host, which has a consequence worth knowing:
# a client does not need IPv6 to reach an IPv6-only site through mach5. Turning
# IPv6 off on a laptop stops that laptop reaching v6-only origins; going through
# here does not, as long as this host has v6.
#
#   "system"       whatever the resolver returns, in its order. RFC 6724
#                  usually means IPv6 first when this host has a global v6
#                  address. The default.
#   "prefer-ipv4"  A records first, AAAA after.
#   "prefer-ipv6"  the other way round.
#
# `prefer-ipv4` is for a host whose IPv6 is a 6rd tunnel — IPv6 carried over
# IPv4 through a relay, often much slower than the IPv4 it is riding on. Under
# "system" every dual-stack origin then pays for the tunnel first; under
# `prefer-ipv4` none of them do.
#
# Nothing is ever dropped, only reordered: an AAAA-only origin is still reached,
# because it is still in the list. A preference must not become a refusal.
addresses = "system"

[images]
# Re-encode images to WebP on the way past.
#
# The one thing here that earns the word "accelerator". Text compression wins a
# few percent; images are half the weight of a page. Measured across twenty real
# ones from Wikipedia and the BBC, WebP at quality 80 took 674KB down to 352KB
# and none of them came out larger — a 232KB PNG became 24KB. Screenshots and
# unoptimised photographs are where it pays most; a site whose thumbnails a CDN
# has already squeezed will see a few percent instead.
#
# Three rules keep it from ever making a page worse: only when the client's
# `accept` says it can display WebP, only formats worth converting (never an
# existing WebP or AVIF, never an SVG), and only if the result is actually
# smaller. The response gains `vary: accept`, because what was served now
# depends on what the client asked for.
#
# The cost is CPU — roughly twelve milliseconds an image, on a worker thread —
# and it is currently paid on every request. Caching re-encoded images in
# cache_dir is on the roadmap and is what makes that a one-time cost.
enabled = true
# WebP quality, 0-100. 80 is the usual "indistinguishable at a glance" setting
# and is what the measurements above were taken at.
quality = 80

[passthrough]
# Hosts mach5 must never decrypt.
#
# Everywhere else mach5 terminates TLS, which means it holds the plaintext of
# everything it carries. For most of the web that is the point. For a bank it is
# the wrong guarantee, and `[inject] exclude` does not give the right one — that
# only stops mach5 *changing* a page it has already read.
#
# A listed host is answered by nobody here. mach5 reads the name out of the
# ClientHello without replying to it, opens a socket to the real origin, and
# copies bytes between the two. It never has the keys, never sees a byte of
# plaintext, and your browser checks the origin's own certificate — which is
# also the only arrangement a certificate-pinning app will accept.
#
# A parent covers its subdomains, as in the blocklist: `example-bank.com` covers
# `secure.example-bank.com`, which is what anyone writing that line meant.
#
# Two things worth knowing. A passed-through host gets none of mach5 — no
# blocking, no cosmetic filtering, no picker, no compression — because none of
# that is possible without reading the page; that is the trade. And a client
# that already knows about HTTP/3 for such a host has its h3 handshake refused
# on purpose, so it falls back to TCP where passthrough works.
# hosts = ["example-bank.com", "myhealthprovider.example"]

# Where a passed-through connection is carried to. 443 unless mach5 is
# listening somewhere unusual; a transparent deployment cannot recover a
# nonstandard port without SO_ORIGINAL_DST.
port = 443

[log]
# How much of a URL is written to the log.
#
# mach5 terminates TLS for every device pointed at it, so its log is a record of
# everything those devices did — and the query string is where the dangerous
# part of that lives: OAuth codes, password-reset tokens, session ids, presigned
# signatures, search terms. Written at the default level into a container log
# that is kept until the container is removed, those are credentials sitting on
# disk long after they should have been forgotten.
#
#   "path"  scheme, host and path, without the query. The default.
#   "host"  scheme and host only, for when even a path is too much — a magic
#           link carries its secret there.
#   "full"  everything. For debugging, not for a proxy carrying real traffic.
#
# This covers URLs mach5 logs itself, including the ones quoted back inside a
# library's error message. It cannot cover what a plugin prints: plugin stderr
# goes straight to this log, so a plugin that logs bodies or URLs is its own
# decision to make.
urls = "path"

[tls]
# Minted certs have no revocation path, so expiry is the only bound on a leaked
# key. Keep the window short.
leaf_ttl_hours = 24
# Backdate notBefore so clients whose clocks run behind still accept the cert.
clock_skew_minutes = 60
# Re-mint a cached leaf once less than this remains.
refresh_margin_minutes = 60

# Typing this phrase on the certificate warning page lets you through to the
# origin anyway — for that one host, for bypass_ttl_minutes. Chrome's mechanism
# and Chrome's phrase: a warning with a button on it is one people click through
# without reading, where something you have to already know and type does not
# happen by accident. The page deliberately says nothing about it.
#
# It exists for staging work: self-signed certs, expired certs, a cert issued to
# a name you are reaching by IP. It is also the only thing in mach5 that turns
# off a check no client can do for itself any more, so it is per-host, it
# expires, it is held in memory only (a restart forgets every bypass), and every
# request that takes it is a warning in the log.
#
# false removes the mechanism rather than hiding it: the page carries no
# listener and /.mach5/bypass answers 404 like any other unknown path.
allow_bypass = true
bypass_ttl_minutes = 60
# bypass_phrase = "thisisunsafe"

[limits]
# Cap on a buffered request body; bounds what a single stream can allocate.
max_request_body_mb = 10
# Upstream fetch workers, using Maven's -T convention: "1C" is one per core,
# "2C" two per core, "0.5C" half. A bare number is an absolute count.
# "Core" here is the parallelism available to the process, so it stays correct
# under a container CPU limit.
worker_threads = "1C"
connect_timeout_seconds = 10
read_timeout_seconds = 30
# How long a plugin may take per hook before it is abandoned.
plugin_timeout_seconds = 10
# Backpressure for streamed responses: how much may sit in memory waiting for a
# slow client before the upstream read pauses. Generous on purpose.
stream_buffer_mb = 32

[quic]
max_datagram_size = 1350
max_idle_timeout_ms = 30000
initial_max_data = 10000000
initial_max_stream_data = 1000000
initial_max_streams = 100
