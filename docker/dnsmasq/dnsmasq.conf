# Wildcard DNS for mach5.
#
# Every name resolves to the proxy, so every request lands there and mach5 reads
# the SNI to learn which origin was actually wanted. That is the whole trick,
# and it is also why this file is dangerous to point at the wrong resolver.
#
# THE INVARIANT: mach5 must never resolve through this server. If it did, every
# origin lookup would come back as mach5's own address and the proxy would fetch
# itself in a loop. compose.yaml pins mach5's `dns:` at a real resolver for
# exactly this reason, and mach5 refuses a request carrying its own marker with
# a 508 rather than recursing — but do not rely on the safety net.

# Answer only on this container's own interface, and never forward a query on:
# this server has exactly one answer and it is a lie.
no-resolv
no-hosts
bogus-priv

# The lie itself. Every A and AAAA query returns the proxy.
#
# Set MACH5_PROXY_IP in .env; the entrypoint substitutes it here. Give the IPv6
# line a real address or drop it — an AAAA that goes nowhere means a client with
# working IPv6 waits for a timeout on every request.
address=/#/${MACH5_PROXY_IP}

# Nothing below the proxy needs to be reachable by name, so refuse everything
# else rather than inventing answers for it.
domain-needed

# Small and loud. This is a single-purpose resolver on a home network, not
# infrastructure; if it is answering a lot of queries, something is wrong.
cache-size=0
log-queries=extra
log-facility=-
