# mach5 configuration.
#
# Every value here is optional — anything omitted falls back to the default
# shown in the comment. Lookup order:
#   $MACH5_CONFIG, then ./mach5.toml, then ~/.config/mach5/mach5.toml

# Address to listen on for QUIC (UDP).
listen = "0.0.0.0:4433"

# Address to listen on for TLS over TCP, serving HTTP/1.1.
#
# This is not optional in practice: HTTP/3 cannot bootstrap itself. A browser
# opens TCP 443 first and only discovers h3 from the Alt-Svc header on a
# response it got over TCP. In a real deployment both of these are port 443.
listen_tcp = "0.0.0.0:4443"

[http]
# Advertises HTTP/3 on every response served over TCP — this is what moves a
# client onto QUIC. Set to "" to keep clients on TCP. In a real deployment the
# port here is 443.
alt_svc = 'h3=":4433"; ma=86400'
keep_alive = true
idle_timeout_seconds = 60

[ca]
# Root CA used to sign leaves minted per SNI host. Leave both unset to generate
# an ephemeral in-memory CA (development only — no browser will trust it).
# Never commit these files; *.pem/*.crt/*.p12 are gitignored.
# cert = "security/mach5_root.crt"
# key = "security/mach5_root.pem"

[paths]
# Scratch space for cached artifacts (re-encoded assets and the like).
# cache_dir = "~/.cache/mach5"

[plugins]
# Directory of executable interceptor plugins, run in filename order. Each is a
# long-running process speaking newline-delimited JSON on stdin/stdout, so it
# can be written in any language. See plugins/README for the protocol.
dir = "plugins"
enabled = true
# Adds an `x-mach5` header to every response — a debugging aid that makes
# interception visible without writing a plugin.
stamp_responses = false

[blocklist]
# First-stage ad blocking: a request to a listed domain is answered here and
# never reaches the origin — or a plugin. Built in rather than a plugin because
# matching a hundred thousand domains on every request should not cross a JSON
# pipe into another process.
#
# A parent domain covers everything beneath it, so `doubleclick.net` also blocks
# `ad.g.doubleclick.net`.
#
# Lists may be hosts files (StevenBlack's hosts file works as-is) or
# Adblock-style domain lists — EasyList's `||ads.example.com^` anchors and its
# `@@||` exceptions are both understood. Anything beyond a domain match —
# cosmetic rules, URL patterns, regexes — is skipped; this is not a filter
# engine. Nothing is bundled: point this at lists you keep updated yourself.
enabled = true
# files = ["~/.config/mach5/hosts", "~/.config/mach5/easylist.txt"]
# Never blocked, whatever the lists say. Covers subdomains too.
# allow = ["example.com"]

[tls]
# Minted certs have no revocation path, so expiry is the only bound on a leaked
# key. Keep the window short.
leaf_ttl_hours = 24
# Backdate notBefore so clients whose clocks run behind still accept the cert.
clock_skew_minutes = 60
# Re-mint a cached leaf once less than this remains.
refresh_margin_minutes = 60

[limits]
# Cap on a buffered request body; bounds what a single stream can allocate.
max_request_body_mb = 10
# Upstream fetch workers, using Maven's -T convention: "1C" is one per core,
# "2C" two per core, "0.5C" half. A bare number is an absolute count.
# "Core" here is the parallelism available to the process, so it stays correct
# under a container CPU limit.
worker_threads = "1C"
connect_timeout_seconds = 10
read_timeout_seconds = 30
# How long a plugin may take per hook before it is abandoned.
plugin_timeout_seconds = 10
# Backpressure for streamed responses: how much may sit in memory waiting for a
# slow client before the upstream read pauses. Generous on purpose.
stream_buffer_mb = 32

[quic]
max_datagram_size = 1350
max_idle_timeout_ms = 30000
initial_max_data = 10000000
initial_max_stream_data = 1000000
initial_max_streams = 100
